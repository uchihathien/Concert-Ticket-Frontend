# Đóng gói bốn app Next thành ảnh container và đẩy lên registry.
#
# Deploy KHÔNG nằm ở đây. `deploy/compose/prod.yml` và khoá SSH tới máy chủ thuộc repo backend, nên
# workflow này dừng ở chỗ đẩy ảnh; việc đưa ảnh vào chạy do `Release` bên đó làm. Đây là cái giá
# của việc tách hai repo, và chỗ này là nơi nó lộ ra rõ nhất.
#
# Sau khi ảnh lên xong, chạy `Release` ở repo backend (workflow_dispatch) với `frontend_tag` là SHA
# của commit này để deploy đúng bản vừa build. Bỏ trống thì nó lấy tag `main`.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [web-customer, web-admin, web-scanner, web-platform]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          # Bối cảnh là gốc repo: pnpm workspace cần cả cây để phân giải package nội bộ.
          context: .
          file: Dockerfile
          build-args: |
            APP=${{ matrix.app }}
            NEXT_PUBLIC_API_BASE_URL=${{ vars.PUBLIC_API_BASE_URL }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.app }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.app }}:main
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      # `NEXT_PUBLIC_*` được NHÚNG vào bundle lúc build, không đọc lúc chạy (Dockerfile đã ghi). Nên
      # một biến sai không hỏng bản build — nó ra một ảnh gọi vào chỗ khác, và chỗ đó chỉ lộ ra khi
      # người dùng thật bấm nút. Kiểm tại đây, lúc còn rẻ.
      #
      # BIẾN RỖNG KHÔNG CÒN LÀ LỖI. `resolveApiBaseUrl` biến nó thành chế độ CÙNG GỐC, và nginx của hệ
      # phục vụ `/v1/` ngay trên tên miền web — một đích hợp lệ, và tốt hơn URL tuyệt đối vì không có
      # preflight CORS. Bản trước `exit 1` ở đây, nhưng bước này chạy SAU `build-push-action`: ảnh đã
      # nằm trên GHCR với tag `:main` rồi, job đỏ không thu hồi được nó. Đó là cách một ảnh có
      # `baseUrl:""` đi lên production trong khi CI báo đỏ, và không ai nối hai việc đó với nhau.
      - name: Địa chỉ API đã nhúng đúng
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/${{ matrix.app }}:${{ github.sha }}"
          URL='${{ vars.PUBLIC_API_BASE_URL }}'
          if [ -z "$URL" ]; then
            echo "PUBLIC_API_BASE_URL rỗng -> ảnh dùng chế độ CÙNG GỐC (nginx proxy /v1/)."
            echo "Khai biến repo đó nếu muốn gọi API qua một tên miền riêng."
            exit 0
          fi
          docker run --rm --entrypoint sh "$IMAGE"             -c "grep -rqF '$URL' /app/apps/${{ matrix.app }}/.next" || {
            echo "Không tìm thấy '$URL' trong bundle — build-arg không tới được Next?"; exit 1; }
          echo "Đã nhúng $URL"
